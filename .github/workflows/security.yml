name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 9 * * 1"

permissions:
  contents: read

jobs:
  capabilities:
    name: Report hosted scanner availability
    runs-on: ubuntu-latest
    # Reviewed repository configuration, not automatic capability detection.
    # October 3: this private repository lacks both hosted features. Change
    # each declaration to enabled when its GitHub feature becomes available.
    env:
      CODEQL_STATE: unavailable
      DEPENDENCY_REVIEW_STATE: unavailable
    outputs:
      codeql: ${{ steps.availability.outputs.codeql }}
      dependency_review: ${{ steps.availability.outputs.dependency_review }}
    steps:
      - name: Validate declarations and report coverage
        id: availability
        shell: bash
        run: |
          set -euo pipefail
          for setting in CODEQL_STATE DEPENDENCY_REVIEW_STATE; do
            case "${!setting}" in
              enabled|unavailable)
                ;;
              *)
                echo "::error::Declare $setting as enabled or unavailable."
                exit 1
                ;;
            esac
          done
          echo "codeql=$CODEQL_STATE" >> "$GITHUB_OUTPUT"
          echo "dependency_review=$DEPENDENCY_REVIEW_STATE" >> "$GITHUB_OUTPUT"
          {
            echo "## Hosted security scanners"
            echo "CodeQL: $CODEQL_STATE"
            echo "Dependency review: $DEPENDENCY_REVIEW_STATE"
            echo
            echo "Unavailable scanners are skipped because this private repository lacks their GitHub features. This does not establish a clean scan."
            echo "CI separately enforces Gitleaks, pip-audit, npm audit and high-severity Python Bandit checks. These do not provide equivalent CodeQL coverage."
            echo "The weekly and manual Security runs also execute that complete CI workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  scheduled-validation:
    name: Run baseline checks on the security schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  dependency-review:
    needs: capabilities
    if: github.event_name == 'pull_request' && needs.capabilities.outputs.dependency_review == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    needs: capabilities
    if: needs.capabilities.outputs.codeql == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
