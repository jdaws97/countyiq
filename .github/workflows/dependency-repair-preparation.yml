name: Dependency repair preparation

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-repair-preparation.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Resolve targeted Python security updates
        run: |
          uv lock --project api --upgrade-package pyjwt --upgrade-package urllib3
          uv lock --project pipelines --upgrade-package urllib3

      - name: Resolve compatible brace expansion updates
        working-directory: frontend
        run: npm update brace-expansion --package-lock-only --ignore-scripts

      - name: Show generated lock changes for review
        run: git diff -- api/uv.lock pipelines/uv.lock frontend/package-lock.json
