name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: pipelines/uv.lock

      - name: Install locked pipeline dependencies
        run: uv sync --project pipelines --locked --extra dev

      - name: Apply Python formatting and verify clean source
        run: |
          uv run --project pipelines ruff format api pipelines docker infra/monitoring
          git diff --exit-code -- api pipelines docker infra/monitoring

      - name: Validate monitoring collector and alert behavior
        run: bash infra/monitoring/check.sh

      - name: Import smoke test
        run: uv run --project pipelines python -c "from countyiq.definitions import defs; print('definitions OK')"

      - name: Run pipeline unit tests
        run: uv run --project pipelines pytest pipelines/tests/ -q -m "not integration"

      - name: Audit pipeline dependencies
        run: uvx pip-audit --path pipelines/.venv/lib/python3.11/site-packages

      - name: Scan pipeline source for high-severity Python issues
        run: uvx bandit==1.9.4 -r pipelines/countyiq -q -lll

  api-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install locked API dependencies
        run: uv sync --project api --locked

      - name: Run API unit tests
        run: uv run --project api python -m pytest api/unit_tests -q

      - name: Audit API dependencies
        run: uvx pip-audit --path api/.venv/lib/python3.11/site-packages

      - name: Scan API source for high-severity Python issues
        run: uvx bandit==1.9.4 -r api -x api/tests,api/unit_tests,api/.venv -q -lll

  database-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.11"

      - name: Install locked API and pipeline dependencies
        run: |
          uv sync --project api --locked
          uv sync --project pipelines --locked --extra dev

      # The API fixture starts postgres-test, creates countyiq_test, migrates
      # from base, and provisions the read-only API role before contracts run.
      - name: Migrate fresh database and run API contracts
        run: uv run --project api python -m pytest api/tests -q

      # Pipeline schema contracts verify migration seed state. API fixtures
      # deliberately rewrite municipality policies, so do not reuse their DB.
      - name: Start isolated pipeline contract database
        run: |
          docker run -d --name countyiq-pipeline-contracts \
            -p 127.0.0.1:5434:5432 \
            -e POSTGRES_DB=countyiq_test -e POSTGRES_USER=dagster_admin \
            -e POSTGRES_PASSWORD=localtest \
            -v "$PWD/pipelines/init-db/01-extensions-schemas.sql:/docker-entrypoint-initdb.d/01-extensions-schemas.sql:ro" \
            postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          for attempt in $(seq 1 30); do
            if docker exec countyiq-pipeline-contracts pg_isready -h 127.0.0.1 -U dagster_admin -d countyiq_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Migrate isolated pipeline database
        working-directory: pipelines
        env:
          DATABASE_URL: postgresql://dagster_admin:localtest@localhost:5434/countyiq_test
        run: uv run alembic upgrade head

      - name: Provision the pipeline maintenance role
        run: |
          docker exec -i \
            -e DATABASE_PIPELINE_USER=countyiq_pipeline_test \
            -e DATABASE_PIPELINE_PASSWORD=test-pipeline-role-password-000000000000000000000 \
            countyiq-pipeline-contracts bash < pipelines/init-db/02-runtime-role.sh

      - name: Run pipeline database contracts
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5434"
          DATABASE_NAME: countyiq_test
          DATABASE_USER: dagster_admin
          DATABASE_PASSWORD: localtest
          TEST_DATABASE_URL: postgresql://dagster_admin:localtest@localhost:5434/countyiq_test
        run: uv run --project pipelines pytest pipelines/tests -q -m integration

      - name: Collect pipeline database logs and clean up
        if: always()
        run: |
          docker logs countyiq-pipeline-contracts || true
          docker rm -fv countyiq-pipeline-contracts || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test browser workspace persistence and exports
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/ci-admin-password-000000000000000000000000000000000000/g' .env
          sed -i 's/CHANGE_ME_PIPELINE_PASSWORD/ci-pipeline-password-00000000000000000000000000000000000/g' .env
          sed -i 's/CHANGE_ME_API_PASSWORD/ci-api-password-00000000000000000000000000000000000000/g' .env
          printf 'CLOUDFLARE_TUNNEL_TOKEN=%0128d\n' 0 >> .env
          docker compose --env-file "$PWD/.env" -f docker/docker-compose.yml config --quiet

      - name: Enforce Cloudflare cost policy
        run: infra/cloudflare/check-cost-policy.sh

      - name: Validate deployment scripts and fail-closed preflight
        run: |
          bash -n docker/check-host.sh docker/setup.sh docker/arm-cost-guard.sh docker/backup.sh docker/cost-guard.sh docker/deploy.sh docker/publish-production-env.sh docker/restore-drill.sh docker/lib/operations.sh infra/cloudflare/check-cost-policy.sh infra/cloudflare/tofu-sops.sh infra/secrets/bootstrap-cloudflare-iac.sh infra/secrets/bootstrap-production.sh
          cat >> .env <<'EOF'
          COUNTYIQ_ARCHIVE_STRICT=true
          R2_ACCESS_KEY_ID=ci-r2-access-key
          R2_SECRET_ACCESS_KEY=ci-r2-secret-key
          R2_ENDPOINT_URL=https://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.r2.cloudflarestorage.com
          COUNTYIQ_BACKUP_R2_ACCESS_KEY_ID=ci-backup-r2-access-key
          COUNTYIQ_BACKUP_R2_SECRET_ACCESS_KEY=ci-backup-r2-secret-key
          COUNTYIQ_BACKUP_BUCKET_LOCK_CONFIRMED=true
          DOMAIN=countyiq.test
          COUNTYIQ_TRUSTED_HOSTS=app.countyiq.test
          COUNTYIQ_AUTH_PROVIDER=cloudflare_access
          COUNTYIQ_ACCESS_ISSUER=https://ci-team.cloudflareaccess.com
          COUNTYIQ_ACCESS_AUD=ci-reviewed-application-audience
          COUNTYIQ_APP_URL=https://app.countyiq.test
          COUNTYIQ_WORKSPACE_ORIGINS=https://app.countyiq.test
          EOF
          env \
            COUNTYIQ_DEPLOY_REF="$(git rev-parse HEAD)" \
            COUNTYIQ_ENV_FILE="$PWD/.env" \
            docker/deploy.sh --check

      - name: Build and validate the migration image
        run: |
          docker build -f docker/Migrations.Dockerfile -t countyiq-migrate:ci .
          docker run --rm --network none countyiq-migrate:ci alembic heads
          docker run --rm --network none countyiq-migrate:ci python -c 'import importlib.util; assert importlib.util.find_spec("dagster") is None'

      - name: Build web image and validate Caddy configuration
        run: |
          docker build -f docker/Caddy.Dockerfile -t countyiq-web:ci .
          docker run --rm countyiq-web:ci caddy validate --config /etc/caddy/Caddyfile

      - name: Verify web startup with production restrictions
        run: |
          set -euo pipefail
          container=$(docker run -d --read-only --tmpfs /tmp:size=32m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 256m -e DOMAIN=countyiq.test countyiq-web:ci)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 15); do
            if docker exec "$container" wget -q -O /dev/null http://localhost:8080/healthz; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1
