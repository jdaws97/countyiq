name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: pipelines/uv.lock

      - name: Install locked pipeline dependencies
        run: uv sync --project pipelines --locked --extra dev

      - name: Import smoke test
        run: uv run --project pipelines python -c "from countyiq.definitions import defs; print('definitions OK')"

      - name: Run pipeline unit tests
        run: uv run --project pipelines pytest pipelines/tests/ -q -k "not integration"

  api-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install locked API dependencies
        run: uv sync --project api --locked

      - name: Run API unit tests
        run: uv run --project api pytest api/unit_tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
