name: countyiq

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-dagster-common: &dagster-common
  image: countyiq-dagster:${COUNTYIQ_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: pipelines/Dockerfile
  restart: unless-stopped
  init: true
  environment:
    DAGSTER_HOME: /opt/dagster/home
    DAGSTER_LOCAL_ARTIFACT_STORAGE_DIR: /opt/dagster/storage/artifacts
    DAGSTER_COMPUTE_LOGS_DIR: /opt/dagster/storage/compute_logs
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${DATABASE_NAME:-countyiq}
    DATABASE_USER: ${DATABASE_PIPELINE_USER:?DATABASE_PIPELINE_USER must be set}
    DATABASE_PASSWORD: ${DATABASE_PIPELINE_PASSWORD:?DATABASE_PIPELINE_PASSWORD must be set}
    COUNTY: ${COUNTY:-york}
    COUNTYIQ_COUNTY_CONFIG_DIR: ${COUNTYIQ_COUNTY_CONFIG_DIR:-}
    COUNTYIQ_ARCHIVE_DIR: /opt/countyiq/archives
    COUNTYIQ_ARCHIVE_STRICT: ${COUNTYIQ_ARCHIVE_STRICT:-false}
    COUNTYIQ_LLM_ARCHIVE_RETENTION_DAYS: ${COUNTYIQ_LLM_ARCHIVE_RETENTION_DAYS:-90}
    COUNTYIQ_ERROR_BUDGET: ${COUNTYIQ_ERROR_BUDGET:-0.3}
    CODEX_HOME: /opt/countyiq/codex-auth
    COUNTYIQ_SUBSCRIPTION_STATE_DIR: /opt/countyiq/intelligence/subscription
    COUNTYIQ_LLM_BACKEND: ${COUNTYIQ_LLM_BACKEND:-openrouter}
    COUNTYIQ_CODEX_MODEL: ${COUNTYIQ_CODEX_MODEL:-gpt-6-astra}
    COUNTYIQ_CODEX_TIMEOUT_SECONDS: ${COUNTYIQ_CODEX_TIMEOUT_SECONDS:-600}
    COUNTYIQ_PASS0_BACKEND: ${COUNTYIQ_PASS0_BACKEND:-}
    COUNTYIQ_PASS1_BACKEND: ${COUNTYIQ_PASS1_BACKEND:-}
    COUNTYIQ_PASS2_BACKEND: ${COUNTYIQ_PASS2_BACKEND:-}
    COUNTYIQ_PASS3_BACKEND: ${COUNTYIQ_PASS3_BACKEND:-}
    COUNTYIQ_PASS4_BACKEND: ${COUNTYIQ_PASS4_BACKEND:-}
    COUNTYIQ_PASS0_CODEX_MODEL: ${COUNTYIQ_PASS0_CODEX_MODEL:-}
    COUNTYIQ_PASS1_CODEX_MODEL: ${COUNTYIQ_PASS1_CODEX_MODEL:-}
    COUNTYIQ_PASS2_CODEX_MODEL: ${COUNTYIQ_PASS2_CODEX_MODEL:-}
    COUNTYIQ_PASS3_CODEX_MODEL: ${COUNTYIQ_PASS3_CODEX_MODEL:-}
    COUNTYIQ_PASS4_CODEX_MODEL: ${COUNTYIQ_PASS4_CODEX_MODEL:-}
    COUNTYIQ_PASS0_CODEX_ESCALATION_MODEL: ${COUNTYIQ_PASS0_CODEX_ESCALATION_MODEL:-}
    COUNTYIQ_PASS1_CODEX_ESCALATION_MODEL: ${COUNTYIQ_PASS1_CODEX_ESCALATION_MODEL:-}
    COUNTYIQ_PASS2_CODEX_ESCALATION_MODEL: ${COUNTYIQ_PASS2_CODEX_ESCALATION_MODEL:-}
    COUNTYIQ_PASS3_CODEX_ESCALATION_MODEL: ${COUNTYIQ_PASS3_CODEX_ESCALATION_MODEL:-}
    COUNTYIQ_PASS4_CODEX_ESCALATION_MODEL: ${COUNTYIQ_PASS4_CODEX_ESCALATION_MODEL:-}
    COUNTYIQ_PASS0_CODEX_MAX_CALLS: ${COUNTYIQ_PASS0_CODEX_MAX_CALLS:-100}
    COUNTYIQ_PASS1_CODEX_MAX_CALLS: ${COUNTYIQ_PASS1_CODEX_MAX_CALLS:-100}
    COUNTYIQ_PASS2_CODEX_MAX_CALLS: ${COUNTYIQ_PASS2_CODEX_MAX_CALLS:-100}
    COUNTYIQ_PASS3_CODEX_MAX_CALLS: ${COUNTYIQ_PASS3_CODEX_MAX_CALLS:-100}
    COUNTYIQ_PASS4_CODEX_MAX_CALLS: ${COUNTYIQ_PASS4_CODEX_MAX_CALLS:-100}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
