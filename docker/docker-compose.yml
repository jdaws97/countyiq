x-dagster-common: &dagster-common
  image: countyiq-dagster:local
  build:
    context: ..
    dockerfile: pipelines/Dockerfile
  restart: unless-stopped
  init: true
  environment:
    DAGSTER_HOME: /opt/dagster/home
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${DATABASE_NAME:-countyiq}
    DATABASE_USER: ${DATABASE_PIPELINE_USER:?DATABASE_PIPELINE_USER must be set}
    DATABASE_PASSWORD: ${DATABASE_PIPELINE_PASSWORD:?DATABASE_PIPELINE_PASSWORD must be set}
    COUNTY: ${COUNTY:-york}
    COUNTYIQ_COUNTY_CONFIG_DIR: ${COUNTYIQ_COUNTY_CONFIG_DIR:-}
    COUNTYIQ_ARCHIVE_DIR: /opt/countyiq/archives
    COUNTYIQ_ARCHIVE_STRICT: ${COUNTYIQ_ARCHIVE_STRICT:-false}
    COUNTYIQ_LLM_ARCHIVE_RETENTION_DAYS: ${COUNTYIQ_LLM_ARCHIVE_RETENTION_DAYS:-90}
    COUNTYIQ_ERROR_BUDGET: ${COUNTYIQ_ERROR_BUDGET:-0.3}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    COUNTYIQ_OPENROUTER_MODEL: ${COUNTYIQ_OPENROUTER_MODEL:-}
    COUNTYIQ_PASS0_MODEL: ${COUNTYIQ_PASS0_MODEL:-}
    COUNTYIQ_PASS1_MODEL: ${COUNTYIQ_PASS1_MODEL:-}
    COUNTYIQ_PASS2_MODEL: ${COUNTYIQ_PASS2_MODEL:-}
    COUNTYIQ_PASS3_MODEL: ${COUNTYIQ_PASS3_MODEL:-}
    COUNTYIQ_PASS4_MODEL: ${COUNTYIQ_PASS4_MODEL:-}
    COUNTYIQ_PASS0_ENABLED: ${COUNTYIQ_PASS0_ENABLED:-false}
    COUNTYIQ_PASS1_ENABLED: ${COUNTYIQ_PASS1_ENABLED:-false}
    COUNTYIQ_PASS2_ENABLED: ${COUNTYIQ_PASS2_ENABLED:-false}
    COUNTYIQ_PASS3_ENABLED: ${COUNTYIQ_PASS3_ENABLED:-false}
    COUNTYIQ_PASS4_ENABLED: ${COUNTYIQ_PASS4_ENABLED:-false}
    COUNTYIQ_PASS0_MAX_ITEMS: ${COUNTYIQ_PASS0_MAX_ITEMS:-25}
    COUNTYIQ_PASS1_MAX_ITEMS: ${COUNTYIQ_PASS1_MAX_ITEMS:-25}
    COUNTYIQ_PASS2_MAX_ITEMS: ${COUNTYIQ_PASS2_MAX_ITEMS:-25}
    COUNTYIQ_PASS3_MAX_ITEMS: ${COUNTYIQ_PASS3_MAX_ITEMS:-25}
    COUNTYIQ_PASS4_MAX_ITEMS: ${COUNTYIQ_PASS4_MAX_ITEMS:-25}
    COUNTYIQ_PASS0_MAX_TOKENS: ${COUNTYIQ_PASS0_MAX_TOKENS:-}
    COUNTYIQ_PASS1_MAX_TOKENS: ${COUNTYIQ_PASS1_MAX_TOKENS:-}
    COUNTYIQ_PASS2_MAX_TOKENS: ${COUNTYIQ_PASS2_MAX_TOKENS:-}
    COUNTYIQ_PASS3_MAX_TOKENS: ${COUNTYIQ_PASS3_MAX_TOKENS:-}
    COUNTYIQ_PASS4_MAX_TOKENS: ${COUNTYIQ_PASS4_MAX_TOKENS:-}
    COUNTYIQ_PASS0_MAX_PDF_BYTES: ${COUNTYIQ_PASS0_MAX_PDF_BYTES:-8388608}
    COUNTYIQ_PASS0_PDF_ENGINE: ${COUNTYIQ_PASS0_PDF_ENGINE:-native}
    COUNTYIQ_PASS1_TRIALS: ${COUNTYIQ_PASS1_TRIALS:-3}
    COUNTYIQ_PASS1_ADAPTIVE_VOTING: ${COUNTYIQ_PASS1_ADAPTIVE_VOTING:-true}
    COUNTYIQ_PASS2_TRIALS: ${COUNTYIQ_PASS2_TRIALS:-1}
    COUNTYIQ_STRICT_SCHEMA: ${COUNTYIQ_STRICT_SCHEMA:-true}
    COUNTYIQ_THINKING: ${COUNTYIQ_THINKING:-}
    COUNTYIQ_PASS0_THINKING: ${COUNTYIQ_PASS0_THINKING:-}
    COUNTYIQ_PASS1_THINKING: ${COUNTYIQ_PASS1_THINKING:-}
    COUNTYIQ_PASS2_THINKING: ${COUNTYIQ_PASS2_THINKING:-}
    COUNTYIQ_PASS3_THINKING: ${COUNTYIQ_PASS3_THINKING:-}
    COUNTYIQ_PASS4_THINKING: ${COUNTYIQ_PASS4_THINKING:-}
    COUNTYIQ_PASS0_REASONING_EFFORT: ${COUNTYIQ_PASS0_REASONING_EFFORT:-}
    COUNTYIQ_PASS1_REASONING_EFFORT: ${COUNTYIQ_PASS1_REASONING_EFFORT:-}
    COUNTYIQ_PASS2_REASONING_EFFORT: ${COUNTYIQ_PASS2_REASONING_EFFORT:-}
    COUNTYIQ_PASS3_REASONING_EFFORT: ${COUNTYIQ_PASS3_REASONING_EFFORT:-}
    COUNTYIQ_PASS4_REASONING_EFFORT: ${COUNTYIQ_PASS4_REASONING_EFFORT:-}
    COUNTYIQ_PASS0_ESCALATION_MODEL: ${COUNTYIQ_PASS0_ESCALATION_MODEL:-}
    COUNTYIQ_PASS1_ESCALATION_MODEL: ${COUNTYIQ_PASS1_ESCALATION_MODEL:-}
    COUNTYIQ_PASS2_ESCALATION_MODEL: ${COUNTYIQ_PASS2_ESCALATION_MODEL:-}
    COUNTYIQ_PASS3_ESCALATION_MODEL: ${COUNTYIQ_PASS3_ESCALATION_MODEL:-}
    COUNTYIQ_PASS4_ESCALATION_MODEL: ${COUNTYIQ_PASS4_ESCALATION_MODEL:-}
    COUNTYIQ_PASS0_ESCALATION_REASONING_EFFORT: ${COUNTYIQ_PASS0_ESCALATION_REASONING_EFFORT:-}
    COUNTYIQ_PASS1_ESCALATION_REASONING_EFFORT: ${COUNTYIQ_PASS1_ESCALATION_REASONING_EFFORT:-}
    COUNTYIQ_PASS2_ESCALATION_REASONING_EFFORT: ${COUNTYIQ_PASS2_ESCALATION_REASONING_EFFORT:-}
    COUNTYIQ_PASS3_ESCALATION_REASONING_EFFORT: ${COUNTYIQ_PASS3_ESCALATION_REASONING_EFFORT:-}
    COUNTYIQ_PASS4_ESCALATION_REASONING_EFFORT: ${COUNTYIQ_PASS4_ESCALATION_REASONING_EFFORT:-}
    COUNTYIQ_MAX_PRICE_PROMPT: ${COUNTYIQ_MAX_PRICE_PROMPT:-}
    COUNTYIQ_MAX_PRICE_COMPLETION: ${COUNTYIQ_MAX_PRICE_COMPLETION:-}
    COUNTYIQ_ZDR: ${COUNTYIQ_ZDR:-false}
    COUNTYIQ_PROCEEDINGS_MAX_DOCUMENT_REQUESTS: ${COUNTYIQ_PROCEEDINGS_MAX_DOCUMENT_REQUESTS:-250}
    COUNTYIQ_PROCEEDINGS_MAX_DOCUMENTS_PER_BODY: ${COUNTYIQ_PROCEEDINGS_MAX_DOCUMENTS_PER_BODY:-25}
    COUNTYIQ_PROCEEDINGS_MAX_FUTURE_DAYS: ${COUNTYIQ_PROCEEDINGS_MAX_FUTURE_DAYS:-90}
    COUNTYIQ_PA_DOS_MAX_NAMES_PER_RUN: ${COUNTYIQ_PA_DOS_MAX_NAMES_PER_RUN:-500}
    COUNTYIQ_PA_DOS_FOUND_TTL_DAYS: ${COUNTYIQ_PA_DOS_FOUND_TTL_DAYS:-30}
    COUNTYIQ_PA_DOS_NOT_FOUND_TTL_DAYS: ${COUNTYIQ_PA_DOS_NOT_FOUND_TTL_DAYS:-180}
    SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
    SLACK_WEBHOOK_CRITICAL: ${SLACK_WEBHOOK_CRITICAL:-}
    SLACK_WEBHOOK_WARNING: ${SLACK_WEBHOOK_WARNING:-}
    SLACK_WEBHOOK_PIPELINE: ${SLACK_WEBHOOK_PIPELINE:-}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
    S3_RAW_BUCKET: ${S3_RAW_BUCKET:-countyiq-raw}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
  depends_on:
    postgres:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - dagster-storage:/opt/dagster/storage
    - ../archives:/opt/countyiq/archives
  networks:
    - database
    - pipeline-egress

services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: countyiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-countyiq}
      POSTGRES_USER: ${DATABASE_USER:-dagster_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_API_USER: ${DATABASE_API_USER:?DATABASE_API_USER must be set}
      DATABASE_API_PASSWORD: ${DATABASE_API_PASSWORD:?DATABASE_API_PASSWORD must be set}
      DATABASE_PIPELINE_USER: ${DATABASE_PIPELINE_USER:?DATABASE_PIPELINE_USER must be set}
      DATABASE_PIPELINE_PASSWORD: ${DATABASE_PIPELINE_PASSWORD:?DATABASE_PIPELINE_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../pipelines/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    pids_limit: 256
    networks:
      - database

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: countyiq-api
    restart: unless-stopped
    init: true
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-countyiq}
      DATABASE_USER: ${DATABASE_API_USER:?DATABASE_API_USER must be set}
      DATABASE_PASSWORD: ${DATABASE_API_PASSWORD:?DATABASE_API_PASSWORD must be set}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
      COUNTY: ${COUNTY:-york}
      COUNTYIQ_COUNTY_NAME: ${COUNTYIQ_COUNTY_NAME:-}
      COUNTYIQ_COUNTY_STATE: ${COUNTYIQ_COUNTY_STATE:-PA}
      COUNTYIQ_PRODUCT_STAGE: ${COUNTYIQ_PRODUCT_STAGE:-alpha}
      COUNTYIQ_OPEN_DATA_SOURCE_KEY: ${COUNTYIQ_OPEN_DATA_SOURCE_KEY:-york_open_data}
      COUNTYIQ_CORS_ORIGINS: ${COUNTYIQ_CORS_ORIGINS:-}
      COUNTYIQ_TRUSTED_HOSTS: ${COUNTYIQ_TRUSTED_HOSTS:-localhost}
      COUNTYIQ_EXPOSE_API_DOCS: ${COUNTYIQ_EXPOSE_API_DOCS:-false}
      COUNTYIQ_ENABLE_RESTRICTED_DISTRESS: ${COUNTYIQ_ENABLE_RESTRICTED_DISTRESS:-false}
      COUNTYIQ_OPS_HEALTH_TTL: ${COUNTYIQ_OPS_HEALTH_TTL:-60}
      COUNTYIQ_SEARCH_API_KEY: ${COUNTYIQ_SEARCH_API_KEY:-}
      COUNTYIQ_SEARCH_LLM_ENABLED: ${COUNTYIQ_SEARCH_LLM_ENABLED:-false}
      COUNTYIQ_SEARCH_MODEL: ${COUNTYIQ_SEARCH_MODEL:-}
      COUNTYIQ_SEARCH_RATE_PER_MIN: ${COUNTYIQ_SEARCH_RATE_PER_MIN:-10}
      COUNTYIQ_SEARCH_BURST: ${COUNTYIQ_SEARCH_BURST:-5}
      COUNTYIQ_SEARCH_DAILY_LLM_BUDGET: ${COUNTYIQ_SEARCH_DAILY_LLM_BUDGET:-2000}
      COUNTYIQ_SENSITIVE_RATE_PER_MIN: ${COUNTYIQ_SENSITIVE_RATE_PER_MIN:-30}
      COUNTYIQ_SENSITIVE_BURST: ${COUNTYIQ_SENSITIVE_BURST:-10}
      COUNTYIQ_RATE_LIMIT_MAX_CLIENTS: ${COUNTYIQ_RATE_LIMIT_MAX_CLIENTS:-10000}
      # Only the dedicated Caddy bridge may supply forwarding headers.
      FORWARDED_ALLOW_IPS: 172.31.254.0/24
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - proxy
      - database
      - api-egress

  dagster-webserver:
    <<: *dagster-common
    container_name: countyiq-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "countyiq.definitions"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  dagster-daemon:
    <<: *dagster-common
    container_name: countyiq-dagster-daemon
    command: ["dagster-daemon", "run", "-m", "countyiq.definitions"]

  migrate:
    image: countyiq-dagster:local
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "/opt/pipelines/alembic.ini", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    networks:
      - database

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: countyiq-caddy
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    networks:
      - proxy
      - caddy-egress

volumes:
  postgres-data:
  dagster-storage:
  caddy-data:
  caddy-config:

networks:
  database:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.31.254.0/24
  api-egress:
  pipeline-egress:
  caddy-egress:
