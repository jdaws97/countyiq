x-dagster-common: &dagster-common
  image: countyiq-dagster:local
  build:
    context: ..
    dockerfile: pipelines/Dockerfile
  restart: unless-stopped
  env_file: ../.env
  environment:
    DAGSTER_HOME: /opt/dagster/home
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    COUNTYIQ_ARCHIVE_DIR: /opt/countyiq/archives
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - dagster-storage:/opt/dagster/storage
    - ../archives:/opt/countyiq/archives

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: countyiq-postgres
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: countyiq
      POSTGRES_USER: dagster_admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../pipelines/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster_admin -d countyiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: countyiq-api
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dagster-webserver:
    <<: *dagster-common
    container_name: countyiq-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "countyiq.definitions"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  dagster-daemon:
    <<: *dagster-common
    container_name: countyiq-dagster-daemon
    command: ["dagster-daemon", "run", "-m", "countyiq.definitions"]

  caddy:
    image: caddy:2-alpine
    container_name: countyiq-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  dagster-storage:
  caddy-data:
  caddy-config:
