[package]
name = "countyiq-arcgis-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "query", "rustls"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
