[project]
name = "countyiq"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Dagster core
    "dagster",
    "dagster-webserver",

    # Database
    "psycopg2-binary",
    "sqlalchemy>=2.0",
    "alembic",

    # Scraping
    "requests",
    "beautifulsoup4",
    "playwright",
    "pdfplumber",

    # AWS / Cloudflare R2 (S3-compatible)
    "boto3",

    # Utilities
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["countyiq*"]
