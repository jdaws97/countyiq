[project]
name = "countyiq"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Dagster core
    "dagster==1.13.1",
    "dagster-postgres==0.29.1",
    "dagster-webserver==1.13.1",
    # Dagster's asset-selection grammar is generated by this ANTLR version.
    "antlr4-python3-runtime==4.13.2",

    # Database
    "psycopg2-binary",
    "sqlalchemy>=2.0",
    "jsonschema>=4.26.0",
    "alembic",

    # Scraping
    "requests",
    "beautifulsoup4",
    "playwright",
    "pdfplumber",

    # Cloudflare R2 (S3-compatible client)
    "boto3",

]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["countyiq*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: requires local Postgres/PostGIS or live infrastructure",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
