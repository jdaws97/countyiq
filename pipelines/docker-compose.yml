services:
  postgres-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: countyiq
      POSTGRES_USER: dagster_admin
      POSTGRES_PASSWORD: localtest
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

volumes:
  pgdata-test:
