code_servers:
  local_startup_timeout: 180

storage:
  postgres:
    postgres_db:
      hostname:
        env: DATABASE_HOST
      username:
        env: DATABASE_USER
      password:
        env: DATABASE_PASSWORD
      db_name: dagster
      port:
        env: DATABASE_PORT

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/storage/artifacts

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/storage/compute_logs

telemetry:
  enabled: false
